[project]
name = "review-tooling"
version = "0.1.1"
description = "Tools for a corpus of signed facts and paper extracts, and the review service for suggested concepts."
requires-python = ">=3.12"

[project.optional-dependencies]
suggest = ["anthropic==2.3.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["review_tooling*"]
