# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  # Whether the merge queue already passed this commit: then the jobs
  # it ran are skipped, and nothing here tests less than the queue did.
  tested:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-tested.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0
    with: {"workflow": ".github/workflows/pr.yml"}
    permissions:
      actions: read
      contents: read

  functional:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-python-functional.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0
    with: {"setup": "python -m venv .venv && .venv/bin/pip install --quiet --require-hashes -r tests/requirements.lock && .venv/bin/pip install --quiet -r requirements.lock", "test": ".venv/bin/python -m pytest -q tests"}

  audit:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-python-audit.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0

  osv:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0

  sonar:
    name: ci
    needs: [tested, functional]
    if: ${{ !failure() && !cancelled() }}
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0
    permissions:
      actions: read
      contents: read
    with: {"sonar-args": "-Dsonar.sources=review_tooling,review-site/review", "reports": "sonar.python.coverage.reportPaths=*.xml", "layout": "-Dsonar.sources=. -Dsonar.tests=tests -Dsonar.exclusions=tests/**", "coverage-run": "${{ needs.tested.outputs.run-id }}"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded or, where the merge queue already passed the
  # commit, was skipped for it. None is skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, functional, audit, osv, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" '.tested.result == "success"
            and all(.[]; .result == "success" or (.result == "skipped" and $tested == "true"))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}' }

  # pubrel's release workflow: on a pull request, a code change records
  # what it changes and a release is the bump its changes require; on
  # main, a published version is tagged and released.
  release:
    needs: passed
    if: ${{ !cancelled() && needs.passed.result == 'success' }}
    uses: Sustenaut/pubrel/.github/workflows/release.yml@5395ddd816d9530b649b92ed0b8b3cfdfe87d7dc # v0.6.1
    with: {"pubrel-version": "v0.6.1"}
    secrets: { RELEASE_APP_ID: '${{ secrets.RELEASE_APP_ID }}', RELEASE_APP_KEY: '${{ secrets.RELEASE_APP_KEY }}' }
    permissions:
      contents: write
